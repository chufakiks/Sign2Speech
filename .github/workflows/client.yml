name: Client

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore:
      - 'functions/**'
      - '.github/workflows/server.yml'
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    concurrency:
      group: ${{ github.ref }}-client
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: antongolub/action-setup-bun@v1

      - name: Install Dependencies
        run: bun install

      - name: Build project
        run: bun run build

      - name: Zip dist
        run: zip -r dist/sign-translate/browser.zip dist/sign-translate/browser/

      - name: Archive dist
        uses: actions/upload-artifact@v4
        with:
          name: build-dist
          path: dist/sign-translate/browser.zip
          retention-days: 1

  website-deploy:
    name: Deploy to Firebase
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download built dist artifact
        uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: .

      - name: Unzip dist
        run: unzip browser.zip

      - name: Deploy Live Channel 🚀
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SIGN_MT }}
          channelId: live
          projectId: sign2speech-3de59

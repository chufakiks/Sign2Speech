name: Client

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore:
      - 'functions/**'
      - '.github/workflows/server.yml'
  pull_request:
    branches: [main, master]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    concurrency:
      group: ${{ github.ref }}-client
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: antongolub/action-setup-bun@v1

      - name: Install Dependencies
        run: bun install

      - name: Build project
        run: bun run build

      - name: Rename index.csr.html to index.html
        run: mv dist/sign-translate/browser/index.csr.html dist/sign-translate/browser/index.html

      - name: List build output
        run: ls -la dist/sign-translate/browser/ | head -20

      - name: Deploy Live Channel 🚀
        if: github.ref == 'refs/heads/master'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SIGN2SPEECH_3DE59 }}
          channelId: live
          projectId: sign2speech-3de59
